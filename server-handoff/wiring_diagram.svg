<svg viewBox="0 0 1040 710" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <rect x="0" y="0" width="1040" height="710" fill="#eef1f0" />

  <!-- faint grid paper -->
  <g stroke="#4a5768" stroke-opacity="0.12" stroke-width="1">
    <path d="M0,20 H1040 M0,60 H1040 M0,100 H1040 M0,140 H1040 M0,180 H1040 M0,220 H1040 M0,260 H1040 M0,300 H1040 M0,340 H1040 M0,380 H1040 M0,420 H1040 M0,460 H1040 M0,500 H1040 M0,540 H1040 M0,580 H1040 M0,620 H1040 M0,660 H1040" />
    <path d="M20,0 V710 M60,0 V710 M100,0 V710 M140,0 V710 M180,0 V710 M220,0 V710 M260,0 V710 M300,0 V710 M340,0 V710 M380,0 V710 M420,0 V710 M460,0 V710 M500,0 V710 M540,0 V710 M580,0 V710 M620,0 V710 M660,0 V710 M700,0 V710 M740,0 V710 M780,0 V710 M820,0 V710 M860,0 V710 M900,0 V710 M940,0 V710 M980,0 V710" />
  </g>

  <text x="40" y="38" fill="#1a2330" font-weight="700" font-size="19" letter-spacing="0.01em">V1 Wiring — Water Tank Level Sensor</text>
  <text x="40" y="58" fill="#1a2330" fill-opacity="0.6" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Seeed XIAO ESP32C6 · HC-SR04 ultrasonic · battery voltage sense</text>

  <!-- power / ground bus rails -->
  <line x1="60" y1="110" x2="950" y2="110" stroke="#c0392b" stroke-width="2.5" />
  <text x="20" y="106" fill="#c0392b" font-weight="700" font-size="12" letter-spacing="0.03em">BAT+</text>
  <line x1="60" y1="580" x2="950" y2="580" stroke="#5b6472" stroke-width="2.5" />
  <text x="24" y="600" fill="#5b6472" font-weight="700" font-size="12" letter-spacing="0.03em">GND</text>

  <!-- battery symbol -->
  <line x1="60" y1="110" x2="60" y2="280" stroke="#c0392b" stroke-width="2.5" />
  <line x1="30" y1="280" x2="90" y2="280" stroke="#1a2330" stroke-width="2" />
  <line x1="45" y1="295" x2="75" y2="295" stroke="#1a2330" stroke-width="6" />
  <line x1="60" y1="295" x2="60" y2="580" stroke="#5b6472" stroke-width="2.5" />
  <text x="98" y="291" fill="#1a2330" fill-opacity="0.8" font-size="11">Li-ion 3.7V (BAT+ / GND)</text>

  <!-- XIAO ESP32C6 -->
  <rect x="430" y="180" width="150" height="320" rx="12" fill="#ffffff" stroke="#4a5768" stroke-width="1.5" />
  <text x="505" y="212" fill="#1a2330" font-weight="700" font-size="15" letter-spacing="0.02em" text-anchor="middle">XIAO ESP32C6</text>
  <text x="505" y="230" fill="#1a2330" fill-opacity="0.55" font-size="11" text-anchor="middle">(Seeed)</text>

  <line x1="505" y1="180" x2="505" y2="110" stroke="#c0392b" stroke-width="2.5" />
  <text x="515" y="148" fill="#1a2330" fill-opacity="0.8" font-size="11">BAT+</text>
  <line x1="505" y1="500" x2="505" y2="580" stroke="#5b6472" stroke-width="2.5" />
  <text x="515" y="548" fill="#1a2330" fill-opacity="0.8" font-size="11">GND</text>

  <!-- GPIO16 / TRIG -->
  <line x1="580" y1="240" x2="760" y2="240" stroke="#2f6fed" stroke-width="2.5" />
  <text x="588" y="234" fill="#1a2330" fill-opacity="0.8" font-size="11">GPIO16 / D6</text>
  <text x="700" y="234" fill="#1a2330" fill-opacity="0.8" font-size="11" text-anchor="middle">TRIG</text>

  <!-- GPIO17 / ECHO (via divider) -->
  <text x="588" y="284" fill="#1a2330" fill-opacity="0.8" font-size="11">GPIO17 / D7</text>
  <path d="M680,324 L620,324 L620,290 L580,290" fill="none" stroke="#c9740c" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- GPIO0 / battery sense (via divider) -->
  <text x="437" y="352" fill="#1a2330" fill-opacity="0.8" font-size="11">GPIO0 / D0</text>
  <text x="437" y="366" fill="#1a2330" fill-opacity="0.8" font-size="11">ADC1_CH0</text>
  <path d="M350,204 L390,204 L390,360 L430,360" fill="none" stroke="#7c4fd1" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- onboard LED note (internal, no external wire) -->
  <circle cx="452" cy="440" r="4" fill="#1a2330" />
  <text x="463" y="444" fill="#1a2330" fill-opacity="0.8" font-size="11">GPIO15 → onboard LED (active-low)</text>

  <!-- HC-SR04 -->
  <rect x="760" y="210" width="200" height="160" rx="10" fill="#ffffff" stroke="#4a5768" stroke-width="1.5" />
  <text x="860" y="240" fill="#1a2330" font-weight="700" font-size="15" letter-spacing="0.02em" text-anchor="middle">HC-SR04</text>
  <text x="860" y="257" fill="#1a2330" fill-opacity="0.55" font-size="11" text-anchor="middle">ultrasonic sensor</text>

  <line x1="800" y1="210" x2="800" y2="110" stroke="#c0392b" stroke-width="2.5" />
  <text x="808" y="172" fill="#1a2330" fill-opacity="0.8" font-size="11">VCC</text>
  <line x1="800" y1="370" x2="800" y2="580" stroke="#5b6472" stroke-width="2.5" />
  <text x="808" y="440" fill="#1a2330" fill-opacity="0.8" font-size="11">GND</text>
  <text x="768" y="234" fill="#1a2330" fill-opacity="0.8" font-size="11">TRIG</text>
  <line x1="760" y1="290" x2="680" y2="290" stroke="#c9740c" stroke-width="2.5" />
  <text x="768" y="284" fill="#1a2330" fill-opacity="0.8" font-size="11">ECHO</text>

  <!-- echo divider -->
  <rect x="672" y="290" width="16" height="34" fill="#ffffff" stroke="#4a5768" stroke-width="1.5" />
  <text x="695" y="312" fill="#1a2330" font-size="11">R1 · 1kΩ</text>
  <circle cx="680" cy="324" r="3.5" fill="#1a2330" />
  <rect x="672" y="324" width="16" height="34" fill="#ffffff" stroke="#4a5768" stroke-width="1.5" />
  <text x="695" y="346" fill="#1a2330" font-size="11">R2 · 3kΩ</text>
  <line x1="680" y1="358" x2="680" y2="580" stroke="#5b6472" stroke-width="2.5" />

  <!-- battery-sense divider -->
  <line x1="350" y1="110" x2="350" y2="170" stroke="#c0392b" stroke-width="2.5" />
  <rect x="342" y="170" width="16" height="34" fill="#ffffff" stroke="#4a5768" stroke-width="1.5" />
  <text x="365" y="192" fill="#1a2330" font-size="11">R3 · 1MΩ</text>
  <circle cx="350" cy="204" r="3.5" fill="#1a2330" />
  <rect x="342" y="204" width="16" height="34" fill="#ffffff" stroke="#4a5768" stroke-width="1.5" />
  <text x="365" y="226" fill="#1a2330" font-size="11">R4 · 1MΩ</text>
  <line x1="350" y1="238" x2="350" y2="580" stroke="#5b6472" stroke-width="2.5" />

  <!-- legend -->
  <line x1="60" y1="630" x2="100" y2="630" stroke="#c0392b" stroke-width="2.5" />
  <text x="110" y="634" fill="#1a2330" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Power (BAT+)</text>
  <line x1="60" y1="655" x2="100" y2="655" stroke="#5b6472" stroke-width="2.5" />
  <text x="110" y="659" fill="#1a2330" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Ground</text>

  <line x1="320" y1="630" x2="360" y2="630" stroke="#2f6fed" stroke-width="2.5" />
  <text x="370" y="634" fill="#1a2330" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Digital out — TRIG</text>
  <line x1="320" y1="655" x2="360" y2="655" stroke="#c9740c" stroke-width="2.5" />
  <text x="370" y="659" fill="#1a2330" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Echo signal (raw)</text>

  <line x1="600" y1="630" x2="640" y2="630" stroke="#7c4fd1" stroke-width="2.5" stroke-dasharray="6 4" />
  <text x="650" y="634" fill="#1a2330" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Battery sense (divided)</text>
  <line x1="600" y1="655" x2="640" y2="655" stroke="#c9740c" stroke-width="2.5" stroke-dasharray="6 4" />
  <text x="650" y="659" fill="#1a2330" font-size="12" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Echo (divided, to GPIO)</text>

  <text x="40" y="695" fill="#1a2330" fill-opacity="0.55" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-style="italic">Fig. 1 — V1 wiring. Dashed = signal after voltage divider. HC-SR04 VCC is wired to BAT+, not 5V/VUSB (unpowered on battery).</text>
</svg>
